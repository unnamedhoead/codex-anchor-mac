<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Anchor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f7f8; --card: #fff; --fg: #1a1a1a; --muted: #6b6b70;
    --line: #e3e3e6; --accent: #2b6cb0; --ok: #1a7f4b; --bad: #b42318;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --card: #202024; --fg: #ececee; --muted: #9a9aa2;
      --line: #32323a; --accent: #6ba4e0; --ok: #4ec98a; --bad: #f0806e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --card: #202024; --fg: #ececee; --muted: #9a9aa2;
    --line: #32323a; --accent: #6ba4e0; --ok: #4ec98a; --bad: #f0806e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .big { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .kv .v { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type=time] {
    font: 600 20px var(--mono); padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button {
    font: 500 14px inherit; padding: 8px 15px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  pre {
    font-family: var(--mono); font-size: 12px; line-height: 1.7; margin: 0;
    white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto;
    color: var(--muted);
  }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #steps { margin-top: 12px; font-size: 13px; }
  #steps div { padding: 3px 0; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <div>
      <h1>Codex Anchor</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <button id="lang" style="padding:5px 11px;font-size:13px">中文</button>
  </div>

  <div class="card">
    <h2 data-i18n="nextRun"></h2>
    <div class="big" id="time">--:--</div>
    <div class="grid" style="margin-top:16px">
      <div class="kv"><div class="k" data-i18n="jobState"></div><div class="v" id="state">…</div></div>
      <div class="kv"><div class="k" data-i18n="pmsetWake"></div><div class="v" id="wake">…</div></div>
      <div class="kv"><div class="k" data-i18n="shouldBe"></div><div class="v" id="expected">…</div></div>
      <div class="kv"><div class="k" data-i18n="timezone"></div><div class="v" id="tz">…</div></div>
      <div class="kv"><div class="k" data-i18n="systemClock"></div><div class="v" id="localtime">…</div></div>
    </div>
    <p class="note" id="warn"></p>
  </div>

  <div class="card">
    <h2 data-i18n="changeTime"></h2>
    <div class="row">
      <select id="tzpick" style="font:14px var(--mono);padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:290px"></select>
      <input type="time" id="picker">
      <button class="primary" id="save" data-i18n="save"></button>
    </div>
<p class="note" data-i18n="timeHint"></p>
    <div id="steps"></div>
  </div>

  <div class="card">
    <h2 data-i18n="controls"></h2>
    <div class="row">
      <button id="toggle">…</button>
      <button class="danger" id="runnow" data-i18n="runNow"></button>
      <span class="note" style="margin:0" data-i18n="runNowHint"></span>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="recentRuns"></h2>
    <pre id="log"></pre>
  </div>
</div>

<script>
const STR = {
  en: {
    sub: 'One tiny scheduled request a day, so your 5-hour quota window starts when you need it',
    nextRun: 'Next run', changeTime: 'Change time', controls: 'Controls', recentRuns: 'Recent runs',
    jobState: 'Job', pmsetWake: 'pmset wake', shouldBe: 'should be',
    timezone: 'Timezone', systemClock: 'System clock',
    save: 'Save', runNow: 'Run now', enable: 'Enable', disable: 'Disable',
    timeHint: 'The time is read in the timezone you pick, then converted to the system clock that launchd understands. The pmset wake is set 3 minutes earlier automatically.',
    runNowHint: 'Running now opens a 5-hour window immediately',
    sameZone: 'same as chosen timezone', noRuns: '(no runs yet)', loading: 'Loading…',
    notConfigured: 'not configured', notLoaded: 'not loaded', notSet: 'not set',
    loaded: 'loaded, waiting', running: 'running', lastExit: 'last exit',
    never: 'never run yet',
    confirmRun: 'Send a real request now? This opens a 5-hour window immediately.',
    warnDrift: tz => `System timezone changed to ${tz}. The schedule was computed for a different one — press Save to re-sync.`,
    warnWake: 'pmset wake does not match the trigger time; the job may be late on battery nights',
    langButton: '中文',
  },
  zh: {
    sub: '每天定时发一次极小的请求，把 5 小时额度窗口锚定在你需要的位置',
    nextRun: '下次触发', changeTime: '修改时间', controls: '控制', recentRuns: '最近运行',
    jobState: '任务状态', pmsetWake: 'pmset 唤醒', shouldBe: '应为',
    timezone: '时区', systemClock: '系统时钟',
    save: '保存', runNow: '立即跑一次', enable: '启用', disable: '停用',
    timeHint: '时间按所选时区解释，再换算成 launchd 认得的系统本地时间。pmset 唤醒自动设为提前 3 分钟。',
    runNowHint: '立即跑会当场开一个 5 小时窗口',
    sameZone: '与所选时区相同', noRuns: '（暂无记录）', loading: '加载中…',
    notConfigured: '未配置', notLoaded: '未加载', notSet: '未设置',
    loaded: '已加载，待触发', running: '运行中', lastExit: '上次退出码',
    never: '尚未运行过',
    confirmRun: '立即发一次真实请求？这会当场开启一个 5 小时窗口。',
    warnDrift: tz => `系统时区已变为 ${tz}，当前计划是按另一个时区算的 —— 点「保存」重新同步。`,
    warnWake: 'pmset 唤醒时间与触发时间不匹配，没插电的夜里可能迟到',
    langButton: 'EN',
  },
};
let lang = 'en';
try { lang = localStorage.getItem('lang') || 'en'; } catch (e) {}
const T = () => STR[lang];

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const v = T()[el.dataset.i18n];
    if (typeof v === 'string') el.textContent = v;
  }
  document.getElementById('lang').textContent = T().langButton;
  if (st) render(st);
}

document.getElementById('lang').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
};
</script>
<script>
let st = null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function api(path, body) {
  const r = await fetch(path, body ? {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  } : undefined);
  return r.json();
}

function describeState(s) {
  if (!s.loaded) return T().notLoaded;
  const base = s.running ? T().running : T().loaded;
  // "(never exited)" is launchctl's own wording; do not leak it to the UI.
  return s.lastExit == null ? `${base} · ${T().never}`
                            : `${base} · ${T().lastExit} ${s.lastExit}`;
}

function render(s) {
  st = s;
  document.getElementById('time').textContent = s.time || T().notConfigured;
  document.getElementById('state').textContent = describeState(s);
  document.getElementById('state').className = 'v ' + (s.loaded ? 'ok' : 'bad');
  document.getElementById('wake').textContent =
    s.pmsetWake === 'not set' ? T().notSet : s.pmsetWake;
  document.getElementById('expected').textContent = s.expectedWake || '-';
  document.getElementById('tz').textContent = s.timezone;
  document.getElementById('localtime').textContent =
    s.sameClock ? T().sameZone : `${s.localTime} (${s.systemTimezone})`;
  const sel = document.getElementById('tzpick');
  if (!sel.options.length) {
    sel.innerHTML = s.timezones.map(t =>
      `<option value="${esc(t.name)}"${t.name === s.timezone ? ' selected' : ''}>` +
      `${esc(t.label)}</option>`).join('');
  }
  if (s.time && !document.getElementById('picker').value) {
    document.getElementById('picker').value = s.time;
  }
  const warn = document.getElementById('warn');
  const w = (s.pmsetWake || '').replace(/(AM|PM)$/i, '').trim();
  const mismatch = s.expectedWake && !matches(w, s.expectedWake);
  warn.textContent = s.drifted ? '⚠️ ' + T().warnDrift(s.systemTimezone)
    : mismatch ? '⚠️ ' + T().warnWake : '';
  warn.className = 'note bad';
  const t = document.getElementById('toggle');
  t.textContent = s.loaded ? T().disable : T().enable;
  document.getElementById('log').textContent = s.runs.length
    ? s.runs.join('\n') : T().noRuns;
}

// pmset prints 4:27AM; the panel stores 04:27.
function matches(pmset, expected) {
  const m = pmset.match(/(\d{1,2}):(\d{2})/);
  if (!m) return false;
  const [, h, mi] = m;
  return String(h).padStart(2, '0') + ':' + mi === expected;
}

async function refresh() { render(await api('/api/status')); }

document.getElementById('save').onclick = async (e) => {
  const v = document.getElementById('picker').value;
  if (!v) return;
  const [hour, minute] = v.split(':').map(Number);
  e.target.disabled = true;
  const res = await api('/api/time',
    {hour, minute, timezone: document.getElementById('tzpick').value});
  e.target.disabled = false;
  const box = document.getElementById('steps');
  box.innerHTML = (res.steps || []).map(s =>
    `<div class="${s.ok ? 'ok' : 'bad'}">${s.ok ? '✓' : '✗'} ${esc(s.step)}` +
    `${s.detail ? ' — ' + esc(s.detail) : ''}</div>`).join('')
    || `<div class="bad">${esc(res.error || '未知错误')}</div>`;
  if (res.status) render(res.status);
};

document.getElementById('toggle').onclick = async (e) => {
  e.target.disabled = true;
  const res = await api('/api/toggle', {enable: !st.loaded});
  e.target.disabled = false;
  if (res.status) render(res.status);
};

document.getElementById('runnow').onclick = async (e) => {
  if (!confirm(T().confirmRun)) return;
  e.target.disabled = true;
  await api('/api/run', {});
  setTimeout(() => { e.target.disabled = false; refresh(); }, 4000);
};

applyLang();
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
